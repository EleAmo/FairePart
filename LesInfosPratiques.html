    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
    
<body>
    <!-- Bannière en haut -->
    <div class="banner">
        <img src="Images/Menu100px.png" alt="Menu" class="menu-icon">
        <img src="Images/SITE_WEB_PNG_46X18MM.png" alt="Logo" class="logo-center">
    </div>
    
    <!-- Menu déroulant -->

<div class="LIU-content">

        <div class="LIU-centered-text">

        </div>
    </div>
</div>
    
<!-- Script pour toggle menu -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const menuIcon = document.querySelector('.menu-icon');
        const menu = document.querySelector('.dropdown-menu-enfants');

        // Toggle menu au clic sur l'icône
        menuIcon.addEventListener('click', function (e) {
            e.stopPropagation();
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        });

        // Fermer le menu si on clique en dehors
        document.addEventListener('click', function (e) {
            if (!menu.contains(e.target) && menu.style.display === 'flex') {
                menu.style.display = 'none';
            }
        });

        // Empêche les clics dans le menu de fermer le menu
        menu.addEventListener('click', function (e) {
            e.stopPropagation();
        });
    });
</script>
    
</body>
